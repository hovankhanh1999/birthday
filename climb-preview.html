<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mẫu trèo tường</title>
<link rel="preload" as="image" href="./assets/penguin-climb-sample.png">
<link rel="preload" as="image" href="./assets/penguin-wave-sample.png">
<link rel="stylesheet" href="./styles.css?v=wave-sample-1">
<link rel="stylesheet" href="./climb-preview.css?v=2">
<script src="./climb-preview.js" defer></script>
</head>
<body><main class="climb-preview">
<div class="climb-stage" data-phase="ready">
  <p class="climb-bubble" role="status" aria-live="polite" aria-atomic="true" hidden></p>
  <div class="climb-actor" role="img" aria-label="Cánh cụt mặc yếm ló đầu và trèo qua tường">
    <div class="climb-frames"></div><div class="penguin-sprite wave-after-climb"></div>
  </div>
  <div class="preview-wall" aria-hidden="true"></div>
</div>
<button id="replay-climb" type="button">Xem lại đoạn trèo tường</button>
<p class="preview-link"><a href="./wave-preview.html">Xem mẫu vẫy tay đã chốt</a></p>
</main></body></html>
